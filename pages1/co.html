<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/stylekeranjang_co.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
</head>
<body style="background-color: rgb(212, 233, 249);">

    <!--halaman ke-4-->
   <form action="../php/proses_checkout.php" method="POST" enctype="multipart/form-data">
        <!-- Ringkasan Pesanan -->
        <h5 class="mt-4 hal4"><b>Ringkasan Pesanan</b></h5>
        <div class="card">
            <div class="card-body" id="ringkasanPesanan">

            </div>
        </div>
        <br>

        <!-- Metode Pembayaran -->
        <label for="method"><h5 class="hal4"><b>Metode Pembayaran</b></h5></label>
        <div class="card">
            <div class="card-body">
              <input type="radio" id="radio-transfer" name="method" value="transfer" required>Transfer
              <div id="area-transfer">
                <p>Mandiri (123456789)</p> 
                <p>Upload bukti pembayaran</p>
                <input type="file" id="input-bukti" name=upload value="bukti"><hr>
              </div>
                <input type="radio" name="method" value="tunai">Tunai<br>
            </div>
        </div><br>

    <!-- Pemilihan Ekspedisi -->
        <label for="ekspedisi"><h5 class="hal4"><b>Pengantaran</b></h5></label>
        <div class="card">
            <div class="card-body">
                <input type="radio" name="ekspedisi" value="solitare" required>Solitare<br>
                <p class="teks">Tiba dalam beberapa jam</p><hr>
                <input type="radio" name="ekspedisi" value="prioritas">Prioritas<br>
                <p class="teks">Dikirim besok</p><hr>
                <input type="radio" name="ekspedisi" value="ekonomi">Ekonomi
                <p class="teks">1-2 hari</p>
            </div>
        </div><br>

        <!-- Alamat Pengantaran -->
        <h5 class="hal4"><b>Alamat Pengantaran</b></h5>
        <div class="card">
            <div class="card-body">
                <label for="">Nama Penerima</label>
                <input type="text" class="form-control" id="customername" name="customer" placeholder="Masukkan Nama Lengkap" required><br>

                <label for="">Nomor Telepon</label>
                <input type="text" class="form-control" id="phoneNumber" name="telepon" placeholder="Masukkan Nomor HP Anda" required><br>

                <label for="">Alamat Lengkap</label>
                <input type="text" class="form-control" id="address" name="alamat" placeholder="Masukkan Alamat Lengkap Anda" required><br>

                <label for="">Catatan untuk kurir</label>
                <input type="text" class="form-control" id="notes" name="catatan" placeholder="Silakan isi catatan atau informasi penting untuk kurir" required>
            </div>
        </div>
        
        <input type="hidden" name="items_json" id="items_json">
        
         <!--Tombol Check Out  -->
       
        <button type="submit" class="btn btn-outline-primary mx-4 mb-4"><b>Check Out</b></button>
    </form>

<script src="../assets/js/script.js"></script>
</body>
</html>
